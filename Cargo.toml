[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sam <samuv.eth@gmail.com>"]

# A version two crates share is pinned in `[workspace.dependencies]`; feature additions stay per
# crate. `image` stays per-crate: its consumers differ on default features, and a member cannot
# turn off default features that a workspace entry enables.
# `too_many_arguments` is off: a Bevy system's parameter list is its dependency declaration.
[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
anyhow = "1.0.102"
# bevy's default features spelled out without `audio`: `2d`, `3d` and `ui` each pull `bevy_audio`
# and `vorbis`, and the client mixes through kira. Add a feature by name, never `2d`/`3d`/`ui`; a
# plugin that takes bevy with its default features brings the audio stack back too.
#
# `default_platform` (winit, gilrs, x11/wayland, sysinfo) is not here: the PlayStation 5 build has
# none of them and brings its own window, input and runner (`benilla-app/src/ps5`). Every other
# target gets it back through `benilla-app`'s `cfg(not(target_env = "ps5"))` table; `std`,
# `default_font` and `multi_threaded` are the parts of it every target keeps.
bevy = { version = "0.18.1", default-features = false, features = [
    # `2d_bevy_render`, `3d_bevy_render`, `ui_bevy_render`, `scene` and `picking`, spelled out
    # member by member: `ui_api` carries `default_app`, whose `custom_cursor` names `bevy_winit`
    # (benilla-app adds `custom_cursor` back off the PlayStation 5).
    "async_executor",
    "bevy_asset",
    "bevy_input_focus",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "reflect_auto_register",
    "std",
    "default_font",
    "multi_threaded",
    # common_api
    "bevy_animation",
    "bevy_camera",
    "bevy_color",
    "bevy_gizmos",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_text",
    "hdr",
    "png",
    # 2d_api, ui_api
    "bevy_sprite",
    "bevy_ui",
    # 3d_api
    "bevy_light",
    "bevy_mikktspace",
    "ktx2",
    "morph_animation",
    "morph",
    "smaa_luts",
    "tonemapping_luts",
    "zstd_rust",
    # the *_bevy_render halves
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_sprite_render",
    "bevy_gizmos_render",
    "bevy_anti_alias",
    "bevy_gltf",
    "bevy_pbr",
    "gltf_animation",
    "bevy_ui_render",
    # scene, picking
    "bevy_scene",
    "bevy_picking",
    "mesh_picking",
    "sprite_picking",
    "ui_picking",
] }
# For the `WOW_GPU_MS` meter's query set, which bevy 0.18 does not wrap; must match bevy's wgpu.
wgpu = "27"
clap = { version = "4.6.1", features = ["derive"] }
sha1 = "0.10.6"

# lua-src builds the addon VM's Lua 5.1.5, patched to accept exactly the 1.12 client's grammar;
# the hunks and the command that checks them: `third_party/lua-src/BENILLA.md`.
[patch.crates-io]
lua-src = { path = "third_party/lua-src" }
# The browser build keeps `lua_Integer = i64` on wasm32 — one-line fork, see third_party/mlua-sys/BENILLA.md.
mlua-sys = { path = "third_party/mlua-sys" }
# kira 0.12.4, patched to compute spatial gains and the volume tween per output chunk and
# interpolate them, not per sample frame (`third_party/kira/BENILLA.md`).
kira = { path = "third_party/kira" }
# wgpu-hal 27.0.4 with the PlayStation 5's Vulkan: RADV linked into the title (no loader to
# dlopen) and a surface on VK_KHR_display's first display. Every hunk is `target_env = "ps5"`
# (`third_party/wgpu-hal/BENILLA.md`).
wgpu-hal = { path = "third_party/wgpu-hal" }

# Dependencies at opt-level 3 in dev: at opt-level 0, avian/parry collision drops a run to <1 fps.
[profile.dev.package."*"]
opt-level = 3

# Our crates at opt-level 1: Bevy's generic hot paths monomorphize into them, and at opt-level 0
# Stormwind drops from a pinned 60 fps to ~45; the warm incremental rebuild cost is ~0.
[profile.dev]
opt-level = 1

# No debuginfo trimming: `debug = "line-tables-only"` measures no recurring win on macOS + sccache.

# The shipping build (`--profile ship`): fat LTO measures -1.0 cpu_ms (-5 %) against `release`,
# which stays the measured profile because fat LTO's link time would tax every iteration.
# `-Ctarget-cpu=native` is not set: it is not portable.
[profile.ship]
inherits = "release"
lto = "fat"
codegen-units = 1

# `release` plus incremental, run as `cargo play`: under `release` a one-line edit to
# `benilla-app` costs 2m47s. Incremental applies to workspace members only, so dependencies stay
# sccache-cacheable; it changes codegen, so it lives here and not in the measured `release`.
[profile.play]
inherits = "release"
incremental = true
# Not for speed: under `incremental`, thin-local LTO leaves promoted `anon.*.llvm.*` symbols
# unresolved and the link fails intermittently (rustc #86049).
lto = "off"
